name = "1pay-shopify"
main = "src/worker.js"
compatibility_date = "2024-10-01"

# Public config — edit these for your store.
[vars]
SHOPIFY_SHOP = "your-store.myshopify.com"   # the *.myshopify.com admin host
SHOP_URL = "https://your-store.com"          # your public storefront (for the return redirect + CORS)
ONEPAY_API_BASE = "https://1pay.cx/api"
SHOPIFY_API_VERSION = "2026-07"

# Secrets — set with `wrangler secret put <NAME>` (never commit these):
#   SHOPIFY_CLIENT_ID      — Client ID from your Dev Dashboard custom app
#   SHOPIFY_CLIENT_SECRET  — Client secret from that app (token refreshed automatically)
#   SHOPIFY_ADMIN_TOKEN    — legacy admin-created custom apps only; use instead of client credentials
#   ONEPAY_API_KEY         — your 1pay.cx API key
#   ONEPAY_WEBHOOK_SECRET  — optional; webhook secret for the key's mode (else fetched from GET /v1/me)
